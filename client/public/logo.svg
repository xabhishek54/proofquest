<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Tile with Rounded Corners -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Highlight Stroke -->
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>

  <!-- Geometric Crown / Proof Quest Sigil -->
  <g filter="url(#shadow)">
    <!-- Crown Spires -->
    <path d="M17 38 L15 22 L25 29 L32 15 L39 29 L49 22 L47 38 Z" fill="#ffffff" fill-opacity="0.97"/>
    
    <!-- Crown Base Band -->
    <rect x="17" y="39" width="30" height="5" rx="2" fill="#ffffff"/>

    <!-- Small QED Box (The formal proof checkmark) -->
    <rect x="36" y="40" width="13" height="13" rx="3" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Checkmark inside QED box -->
    <path d="M39 46.5 L42 49.5 L46 43" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Jewel Spheres on Crown Peaks -->
    <circle cx="32" cy="14" r="3" fill="url(#goldGrad)"/>
    <circle cx="15" cy="21" r="2.2" fill="url(#goldGrad)"/>
    <circle cx="49" cy="21" r="2.2" fill="url(#goldGrad)"/>
  </g>
</svg>
